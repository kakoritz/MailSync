name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer and Cython
        run: pip install 'buildozer>=1.5' 'cython>=3'

      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-mailsync-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-mailsync-v1-

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailsync-apk-${{ github.sha }}
          path: bin/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "MailSync — Latest Android APK"
          body: |
            ## Install MailSync on Android

            1. Download **mailsync-*.apk** below
            2. Open it on your phone
            3. Enable *Install from unknown sources* if prompted

            ---
            Built from `${{ github.ref_name }}` · `${{ github.sha }}`
          files: bin/*.apk
          prerelease: true
          make_latest: true
